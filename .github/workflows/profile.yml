# Gera os SVGs dinâmicos do perfil (snake, estatísticas, streak, atividade e troféus)
# e publica tudo na branch "output", que o README lê.
name: Perfil

on:
  schedule:
    - cron: "0 3 * * *" # todo dia, 00:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar cards de estatísticas
        run: python scripts/profile_cards.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E5739F&color_dots=#EBEDF0,#F9D3E2,#F4AFCB,#EC85AE,#D45A8A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F7A1C4&color_dots=#161B22,#3D1F2E,#6B2F4C,#B0577F,#F7A1C4

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
